name: windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: check the server address is set
        shell: bash
        run: |
          if [ -z "${{ vars.BRANCH_API_URL }}" ]; then
            echo "::warning::BRANCH_API_URL isn't set, so this build uses http://localhost:8080."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: build the installer
        working-directory: app
        env:
          BRANCH_API_URL: ${{ vars.BRANCH_API_URL }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: branch-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
