name: windows build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this version"
        required: false
        default: "Bug fixes and improvements."

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: check the server address is set
        shell: bash
        run: |
          if [ -z "${{ vars.BRANCH_API_URL }}" ]; then
            echo "::warning::BRANCH_API_URL isn't set, so this build uses http://localhost:8080."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: set the version
        shell: bash
        run: node -e "const fs=require('fs');const f='app/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2));" "${{ needs.version.outputs.version }}"

      - name: build the installer
        working-directory: app
        env:
          BRANCH_API_URL: ${{ vars.BRANCH_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: name the files
        shell: bash
        working-directory: app/src-tauri/target/release/bundle/nsis
        run: |
          EXE=$(ls *-setup.exe | head -n 1)
          if [ ! -f "$EXE.sig" ]; then
            echo "::error::the installer wasn't signed for updates"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$EXE" "$GITHUB_WORKSPACE/out/Branch_${{ needs.version.outputs.version }}_x64-setup.exe"
          mv "$EXE.sig" "$GITHUB_WORKSPACE/out/Branch_${{ needs.version.outputs.version }}_x64-setup.exe.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: set the version
        run: node -e "const fs=require('fs');const f='app/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2));" "${{ needs.version.outputs.version }}"

      - name: build the appimage and deb
        working-directory: app
        env:
          BRANCH_API_URL: ${{ vars.BRANCH_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb

      - name: name the files
        working-directory: app/src-tauri/target/release/bundle
        run: |
          V="${{ needs.version.outputs.version }}"
          IMG=$(ls appimage/*.AppImage | head -n 1)
          DEB=$(ls deb/*.deb | head -n 1)
          if [ ! -f "$IMG.sig" ]; then
            echo "::error::the appimage wasn't signed for updates"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$IMG" "$GITHUB_WORKSPACE/out/Branch_${V}_amd64.AppImage"
          mv "$IMG.sig" "$GITHUB_WORKSPACE/out/Branch_${V}_amd64.AppImage.sig"
          mv "$DEB" "$GITHUB_WORKSPACE/out/Branch_${V}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: publish the release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          EXE="Branch_${VERSION}_x64-setup.exe"
          IMG="Branch_${VERSION}_amd64.AppImage"
          DEB="Branch_${VERSION}_amd64.deb"
          node -e "
            const fs = require('fs');
            const [version, exe, img, notes, repo] = process.argv.slice(1);
            const url = (file) => 'https://github.com/' + repo + '/releases/download/v' + version + '/' + file;
            const manifest = {
              version,
              notes: notes || 'Bug fixes and improvements.',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': { signature: fs.readFileSync(exe + '.sig', 'utf8').trim(), url: url(exe) },
                'linux-x86_64': { signature: fs.readFileSync(img + '.sig', 'utf8').trim(), url: url(img) },
              },
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          " "$VERSION" "$EXE" "$IMG" "$NOTES" "${{ github.repository }}"
          printf '%s\n\n**Windows:** download **%s** below.\n\n**Linux:** download **%s** (works on most distros and updates itself) or **%s** for Debian and Ubuntu.\n\nIf you already have Branch, it updates itself.\n' "${NOTES:-Bug fixes and improvements.}" "$EXE" "$IMG" "$DEB" > release-notes.md
          gh release create "v$VERSION" "$EXE" "$EXE.sig" "$IMG" "$IMG.sig" "$DEB" latest.json \
            --repo "${{ github.repository }}" \
            --title "Branch $VERSION" \
            --notes-file release-notes.md \
            --latest
