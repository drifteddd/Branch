<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch</title>
  <link rel="icon" href="shared/branch-mark.svg">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/splash.css">
  <!-- runs before paint so the saved theme doesn't flash -->
  <script src="js/boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- startup screen. app.js fills in the loading text and removes it when ready -->
  <div class="splash" id="splash" role="status" aria-live="polite" aria-label="Loading Branch">
    <div class="splash-inner">
      <img class="splash-icon" src="shared/branch-mark.svg" alt="" width="76" height="76">
      <p class="splash-name">Branch</p>
      <div class="splash-track" aria-hidden="true"><div class="splash-fill" id="splash-fill"></div></div>
      <p class="splash-detail" id="splash-detail">Starting up</p>
    </div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- windows-style window buttons, only shown in the desktop app (it draws its own title bar) -->
  <div class="window-controls" id="window-controls" role="group" aria-label="Window" hidden>
    <button class="wc wc-min" id="wc-min" type="button" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg></button>
    <button class="wc wc-max" id="wc-max" type="button" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true" class="icon-max"><rect x="0.5" y="0.5" width="9" height="9"/></svg><svg viewBox="0 0 10 10" aria-hidden="true" class="icon-restore"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V0.5h7v7h-2"/></svg></button>
    <button class="wc wc-close" id="wc-close" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
  </div>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <div class="brand" data-tauri-drag-region>
        <img src="shared/branch-mark.svg" alt="" width="26" height="26">
        <span data-tauri-drag-region>Branch</span>
      </div>

      <ul class="nav" role="list">
        <li><a href="#/browse" data-nav="all"><span data-icon="grid"></span>All mods</a></li>
        <li><a href="#/tree" data-nav="tree"><span data-icon="tree"></span>Tree of Life</a></li>
        <li><a href="#/featured" data-nav="featured"><span data-icon="sparkle"></span>Featured</a></li>
        <li><a href="#/favorites" data-nav="favorites"><span data-icon="star"></span>Favorites</a></li>
        <li><a href="#/recent" data-nav="recent"><span data-icon="clock"></span>Recently viewed</a></li>
        <li><a href="#/forum" data-nav="forum"><span data-icon="chat"></span>Community</a></li>
      </ul>

      <p class="nav-heading" id="categories-heading">Categories</p>
      <ul class="nav" role="list" id="category-nav" aria-labelledby="categories-heading"></ul>

      <p class="nav-heading" id="tools-heading">Tools</p>
      <ul class="nav" role="list" aria-labelledby="tools-heading">
        <li><a href="#/check" data-nav="check"><span data-icon="shield"></span>Mod checker</a></li>
        <li><a href="#/upload" data-nav="upload"><span data-icon="upload"></span>Upload a mod</a></li>
        <li><a href="#/rewards" data-nav="rewards"><span data-icon="gift"></span>Rewards</a></li>
      </ul>

      <ul class="nav nav-bottom" role="list">
        <li><a href="#/settings" data-nav="settings"><span data-icon="sliders"></span>Settings</a></li>
        <li><a href="#/about" data-nav="about"><span data-icon="info"></span>About</a></li>
      </ul>
    </nav>
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <main id="main" class="main" tabindex="-1">
      <div class="toolbar" role="toolbar" aria-label="Navigation and search" data-tauri-drag-region>
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Show sections" aria-controls="sidebar" aria-expanded="false"><span data-icon="sidebar"></span></button>
        <button class="icon-btn" id="back-button" type="button" aria-label="Back" title="Back (Alt+Left)" hidden><span data-icon="back"></span></button>
        <div class="search" role="search">
          <span data-icon="search" class="search-icon"></span>
          <label for="search" class="visually-hidden">Search mods</label>
          <input id="search" class="search-input" type="search" placeholder="Search mods, authors and tags" autocomplete="off" spellcheck="false">
          <kbd class="search-hint" aria-hidden="true">Ctrl F</kbd>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
